<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة المجد - الدورة</title>
    <link rel="stylesheet" href="course-style.css">
</head>
<body>

    <header class="course-header-bar">
        <div class="brand" onclick="window.location.href='/'" style="cursor:pointer;" title="العودة للصفحة الرئيسية">
            <a href="/" style="text-decoration:none; color:inherit;">🏆 منصة المجد للقدرات</a>
        </div>
        <div class="header-nav">
            <a href="dashboard.html" class="btn-back">← لوحة التحكم</a>
        </div>
    </header>

    <div class="course-container">

        <!-- معلومات الدورة -->
        <div class="course-hero" id="courseHeader">
            <div class="course-hero-content">
                <span class="course-section-tag" id="courseSectionBadge">جاري التحميل...</span>
                <h1 class="course-hero-title" id="courseTitle">جاري التحميل...</h1>
                <p class="course-hero-desc" id="courseDesc"></p>
            </div>
        </div>

        <!-- الدروس -->
        <section class="section-block">
            <h2 class="section-title">🎬 دروس الدورة</h2>
            <div class="lessons-grid" id="lessonsGrid">
                <div class="loading-ph">⏳ جاري التحميل...</div>
            </div>
        </section>

        <!-- الاختبارات -->
        <section class="section-block">
            <h2 class="section-title">📝 اختبارات الدورة</h2>
            <div class="exams-grid" id="examsGrid">
                <div class="loading-ph">⏳ جاري التحميل...</div>
            </div>
        </section>

    </div>

    <script src="course-script.js"></script>
</body>
</html>
